---
# Sunspire Deployment Playbook
# Deploys sunspire.tar.gz to all VMs and runs their deploy scripts
#
# Usage:
#   ansible-playbook -i inventory.ini deploy.yml
#   ansible-playbook -i inventory.ini deploy.yml --limit linux
#   ansible-playbook -i inventory.ini deploy.yml --limit windows
#   ansible-playbook -i inventory.ini deploy.yml --limit solaris,forge

- name: Prepare deployment archive on localhost
  hosts: localhost
  gather_facts: no
  vars:
    archive_name: sunspire.tar.gz
    archive_path: "{{ playbook_dir }}/../{{ archive_name }}"

  tasks:
    - name: Check if archive exists
      stat:
        path: "{{ archive_path }}"
      register: archive_exists

    - name: Create deployment archive
      archive:
        path:
          - "{{ playbook_dir }}/../apps"
          - "{{ playbook_dir }}/../boxes"
          - "{{ playbook_dir }}/../credentials"
        dest: "{{ archive_path }}"
        format: gz
      when: not archive_exists.stat.exists
      register: archive_result

    - name: Archive status
      debug:
        msg: "{{ 'Archive created at ' + archive_path if archive_result.changed | default(false) else 'Using existing archive at ' + archive_path }}"


- name: Deploy to Linux VMs
  hosts: linux
  gather_facts: no
  vars:
    archive_name: sunspire.tar.gz
    archive_path: "{{ playbook_dir }}/../{{ archive_name }}"
    remote_dir: /opt/sunspire
    log_dir: /var/log

  tasks:
    - name: Delete old deploy log
      file:
        path: "{{ log_dir }}/deploy-{{ inventory_hostname }}.log"
        state: absent
      ignore_errors: yes

    - name: Create remote directory
      file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copy archive to remote host
      copy:
        src: "{{ archive_path }}"
        dest: "{{ remote_dir }}/{{ archive_name }}"
        mode: '0644'

    - name: Extract archive
      unarchive:
        src: "{{ remote_dir }}/{{ archive_name }}"
        dest: "{{ remote_dir }}"
        remote_src: yes

    - name: Remove archive after extraction
      file:
        path: "{{ remote_dir }}/{{ archive_name }}"
        state: absent

    - name: Make deploy script executable
      file:
        path: "{{ remote_dir }}/boxes/{{ inventory_hostname }}/deploy/deploy.sh"
        mode: '0755'

    - name: Run deploy script in background
      shell: |
        cd {{ remote_dir }}/boxes/{{ inventory_hostname }}/deploy
        nohup bash -c 'bash deploy.sh && rm -rf {{ remote_dir }}' > {{ log_dir }}/deploy-{{ inventory_hostname }}.log 2>&1 &
      async: 10
      poll: 0

    - name: Deployment started
      debug:
        msg: "Deploy script started on {{ inventory_hostname }}. Logs at {{ log_dir }}/deploy-{{ inventory_hostname }}.log"


- name: Deploy to Windows VMs
  hosts: windows
  gather_facts: no
  vars:
    archive_name: sunspire.tar.gz
    archive_path: "{{ playbook_dir }}/../{{ archive_name }}"
    remote_dir: C:\sunspire
    log_dir: C:\Windows\Temp

  tasks:
    - name: Delete old deploy log
      win_file:
        path: "{{ log_dir }}\\deploy-{{ inventory_hostname }}.log"
        state: absent
      ignore_errors: yes

    - name: Create remote directory
      win_file:
        path: "{{ remote_dir }}"
        state: directory

    - name: Copy archive to remote host
      win_copy:
        src: "{{ archive_path }}"
        dest: "{{ remote_dir }}\\{{ archive_name }}"

    - name: Extract archive
      win_shell: |
        cd "{{ remote_dir }}"
        tar -xzf "{{ archive_name }}"
      args:
        chdir: "{{ remote_dir }}"

    - name: Remove archive after extraction
      win_file:
        path: "{{ remote_dir }}\\{{ archive_name }}"
        state: absent

    - name: Create deploy wrapper script
      win_copy:
        content: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Set-Location '{{ remote_dir }}\boxes\{{ inventory_hostname }}\deploy'
          & '.\deploy.ps1' *> '{{ log_dir }}\deploy-{{ inventory_hostname }}.log'
        dest: "{{ log_dir }}\\deploy-wrapper-{{ inventory_hostname }}.ps1"

    - name: Run deploy script
      win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File "{{ log_dir }}\deploy-wrapper-{{ inventory_hostname }}.ps1"
      async: 1800
      poll: 30

    - name: Clean up
      win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ log_dir }}\\deploy-wrapper-{{ inventory_hostname }}.ps1"
        - "{{ remote_dir }}"
      ignore_errors: yes

    - name: Deployment complete
      debug:
        msg: "Deploy script completed on {{ inventory_hostname }}. Logs at {{ log_dir }}\\deploy-{{ inventory_hostname }}.log"
