# Nginx configuration for Git HTTP server
# Include this in the main server block or as a separate site

server {
    listen 80;
    server_name _;

    # Git repository access (dumb HTTP protocol)
    location /git/ {
        alias /var/lib/git/;
        autoindex on;
        
        # Required for git clone to work
        location ~ /git/.*\.git/objects/([0-9a-f]+/[0-9a-f]+|pack/pack-[0-9a-f]+\.(pack|idx))$ {
            alias /var/lib/git/;
        }
        
        location ~ /git/.*\.git/(HEAD|info/refs|objects/info/.*|git-(upload|receive)-pack)$ {
            alias /var/lib/git/;
        }
    }

    # Default - show available repositories
    location / {
        return 200 'Forge Git Server\n\nAvailable repositories:\n  /git/forge-logs.git\n';
        add_header Content-Type text/plain;
    }
}
