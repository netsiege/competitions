# Nginx configuration for Git HTTP server
# Include this in the main server block or as a separate site

server {
    listen 80;
    server_name _;

    # Git repository access (dumb HTTP protocol)
    location /git/ {
        root /var/lib;
        autoindex on;
        client_max_body_size 0;
    }

    # Default - show available repositories
    location / {
        return 200 'Forge Git Server\n\nAvailable repositories:\n  /git/forge-logs.git\n';
        add_header Content-Type text/plain;
    }
}